<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <!-- 金色圆环弧渐变（IE 图标标志性的金色轨道） -->
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="50%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
  </defs>

  <!-- 紫罗兰渐变圆（atom 主题色背景） -->
  <circle cx="16" cy="16" r="15" fill="url(#bg)"/>

  <!-- 金色圆环弧（IE 标志性的"轨道"）
       大椭圆旋转 -25°，再用一个 mask 切掉一段（右下角缺口避开 e 字母的开口） -->
  <g transform="rotate(-25 16 16)">
    <ellipse cx="16" cy="16" rx="12.5" ry="12.5" fill="none"
             stroke="url(#ring)" stroke-width="1.8" stroke-linecap="round"
             stroke-dasharray="62 16" stroke-dashoffset="-8"/>
  </g>

  <!-- 斜体小写 e 字母（IE 浏览器图标的灵魂）
       用 path 绘制一个粗壮的斜体 e：
       - 圆形外轮廓（开口朝右下）
       - 中间横线
       - 整体倾斜 12° -->
  <g transform="rotate(12 16 16) translate(16 16)">
    <!-- e 的主体：粗壮圆环（开口在右下，约 60°缺口） -->
    <!-- 用 stroke-dasharray 实现开口环 -->
    <circle cx="0" cy="0" r="7" fill="none" stroke="#fff" stroke-width="2.2"
            stroke-dasharray="33 11" stroke-dashoffset="-2"/>
    <!-- e 的横线 -->
    <line x1="-6" y1="0.4" x2="4" y2="0.4" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>
