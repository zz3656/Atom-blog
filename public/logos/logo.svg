<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- 紫罗兰渐变（atom 主题色） -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <!-- 地球仪径向高光 -->
    <radialGradient id="globe" cx="35%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#ffffff" stop-opacity="0.95"/>
      <stop offset="60%" style="stop-color:#c7d2fe" stop-opacity="0.85"/>
      <stop offset="100%" style="stop-color:#818cf8" stop-opacity="0.75"/>
    </radialGradient>
    <!-- Wi-Fi 信号渐变 -->
    <linearGradient id="wave" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- 圆角矩形（"吧" = 一个有边界的容器/空间） -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>

  <!-- 地球仪（"因特" = Internet 的视觉象征） -->
  <!-- 经线（垂直大椭圆） -->
  <ellipse cx="32" cy="38" rx="14" ry="16" fill="url(#globe)" opacity="0.95"/>
  <!-- 赤道（水平大椭圆） -->
  <ellipse cx="32" cy="38" rx="14" ry="5" fill="none" stroke="#4f46e5" stroke-width="0.8" opacity="0.6"/>
  <!-- 经线（纵向） -->
  <ellipse cx="32" cy="38" rx="5" ry="16" fill="none" stroke="#4f46e5" stroke-width="0.8" opacity="0.5"/>
  <!-- 经线（45°） -->
  <ellipse cx="32" cy="38" rx="14" ry="5" fill="none" stroke="#4f46e5" stroke-width="0.6" opacity="0.4" transform="rotate(-45 32 38)"/>
  <!-- 经线（-45°） -->
  <ellipse cx="32" cy="38" rx="14" ry="5" fill="none" stroke="#4f46e5" stroke-width="0.6" opacity="0.4" transform="rotate(45 32 38)"/>

  <!-- Wi-Fi 信号波纹（从右上角发出 = "吧"对外连接、信号发射） -->
  <!-- 信号源：右上角 -->
  <circle cx="48" cy="16" r="2.5" fill="url(#wave)"/>
  <!-- 信号弧 1（最近、最小） -->
  <path d="M 44 14 Q 48 10 52 14" fill="none" stroke="url(#wave)" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
  <!-- 信号弧 2（中等） -->
  <path d="M 40 12 Q 48 4 56 12" fill="none" stroke="url(#wave)" stroke-width="1.8" stroke-linecap="round" opacity="0.65"/>
  <!-- 信号弧 3（最远、最大） -->
  <path d="M 36 10 Q 48 -2 60 10" fill="none" stroke="url(#wave)" stroke-width="1.8" stroke-linecap="round" opacity="0.45"/>
</svg>
