<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="因特吧">
  <!-- 终端屏幕（深色底板，让图标在浅色浏览器标签栏上也有轮廓） -->
  <rect width="128" height="128" fill="#05070a" />

  <!-- 命令提示符 > -->
  <path
    d="M36 36 L64 64 L36 92"
    fill="none"
    stroke="#00e88f"
    stroke-width="16"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />

  <!-- 光标块 -->
  <rect x="76" y="50" width="16" height="28" fill="#00e88f" />
</svg>
