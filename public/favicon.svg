<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- IE-style globe on transparent background -->
  <!-- outer ring -->
  <circle cx="64" cy="64" r="56" fill="none" stroke="#1a1a1a" stroke-width="8"/>
  <!-- horizontal ellipse -->
  <ellipse cx="64" cy="64" rx="56" ry="22" fill="none" stroke="#1a1a1a" stroke-width="5"/>
  <!-- vertical ellipse -->
  <ellipse cx="64" cy="64" rx="22" ry="56" fill="none" stroke="#1a1a1a" stroke-width="5"/>
  <!-- center circle -->
  <circle cx="64" cy="64" r="7" fill="#1a1a1a"/>
</svg>
