<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Sphere gradient for depth -->
    <radialGradient id="globe" cx="40%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#444444"/>
      <stop offset="60%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#000000"/>
    </radialGradient>
    <!-- Gloss highlight -->
    <radialGradient id="gloss" cx="35%" cy="25%" r="30%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.5)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </radialGradient>
    <!-- E gradient -->
    <linearGradient id="eGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#cccccc"/>
    </linearGradient>
    <!-- E shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Globe circle -->
  <circle cx="64" cy="64" r="54" fill="url(#globe)"/>
  
  <!-- Gloss overlay -->
  <circle cx="64" cy="64" r="54" fill="url(#gloss)"/>
  
  <!-- Globe grid lines - horizontal -->
  <ellipse cx="64" cy="64" rx="54" ry="22" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  
  <!-- Globe grid lines - vertical -->
  <ellipse cx="64" cy="64" rx="22" ry="54" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  
  <!-- Globe grid lines - diagonal 1 -->
  <ellipse cx="64" cy="64" rx="54" ry="22" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" transform="rotate(45 64 64)"/>
  
  <!-- Globe grid lines - diagonal 2 -->
  <ellipse cx="64" cy="64" rx="54" ry="22" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" transform="rotate(-45 64 64)"/>
  
  <!-- IE "e" letter -->
  <text x="64" y="82" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="bold" 
        fill="url(#eGrad)" text-anchor="middle" filter="url(#shadow)" transform="rotate(-12 64 64)">e</text>
</svg>
