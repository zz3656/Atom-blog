<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 球体渐变：黑色球面（IE7 桌面图标风格） -->
    <radialGradient id="globe" cx="40%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#444444"/>
      <stop offset="60%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#000000"/>
    </radialGradient>
    <!-- 球体光泽高光 -->
    <radialGradient id="gloss" cx="35%" cy="25%" r="30%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.5)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </radialGradient>
    <!-- 金色圆环弧渐变（IE 图标标志性的金色轨道） -->
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fde68a"/>
      <stop offset="50%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <!-- e 字母阴影 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.8"/>
    </filter>
    <!-- 圆环弧阴影（让金色轨道更立体） -->
    <filter id="ringShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 黑色球体 -->
  <circle cx="64" cy="64" r="58" fill="url(#globe)"/>

  <!-- 球体光泽 -->
  <circle cx="64" cy="64" r="58" fill="url(#gloss)"/>

  <!-- 球体网格线（保留原 IE 桌面图标的"地球"质感） -->
  <ellipse cx="64" cy="64" rx="58" ry="24" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <ellipse cx="64" cy="64" rx="24" ry="58" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <ellipse cx="64" cy="64" rx="58" ry="24" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" transform="rotate(45 64 64)"/>
  <ellipse cx="64" cy="64" rx="58" ry="24" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" transform="rotate(-45 64 64)"/>

  <!-- 金色圆环弧（IE 标志性"轨道"）
       倾斜 -25°，右下角有缺口（约 80° 开口避开 e 的开口） -->
  <g transform="rotate(-25 64 64)" filter="url(#ringShadow)">
    <circle cx="64" cy="64" r="40" fill="none" stroke="url(#ring)" stroke-width="5"
            stroke-linecap="round"
            stroke-dasharray="200 56" stroke-dashoffset="-15"/>
  </g>

  <!-- 斜体小写 e 字母（IE 浏览器图标的核心）
       白色粗壮斜体，倾斜 12° -->
  <g transform="rotate(12 64 64) translate(64 64)" filter="url(#shadow)">
    <!-- e 主体：粗壮圆环（开口朝右下，约 60° 缺口） -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="#fff" stroke-width="7"
            stroke-dasharray="103 35" stroke-dashoffset="-5"/>
    <!-- e 横线 -->
    <line x1="-19" y1="1" x2="13" y2="1" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
