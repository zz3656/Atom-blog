<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="因特吧">
  <!-- 终端窗口 -->
  <rect x="4" y="8" width="56" height="48" fill="#05070a" stroke="#00e88f" stroke-width="2.5" />

  <!-- 标题栏分隔线 -->
  <line x1="4" y1="18" x2="60" y2="18" stroke="#00e88f" stroke-width="2" opacity="0.5" />

  <!-- 标题栏三色状态点 -->
  <circle cx="12" cy="13" r="2" fill="#ff5f57" />
  <circle cx="19" cy="13" r="2" fill="#febc2e" />
  <circle cx="26" cy="13" r="2" fill="#28c840" />

  <!-- 命令提示符 > -->
  <path
    d="M18 34 L26 40 L18 46"
    fill="none"
    stroke="#00e88f"
    stroke-width="3.5"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />

  <!-- 光标块 -->
  <rect x="31" y="34" width="5" height="12" fill="#00e88f" />
</svg>
