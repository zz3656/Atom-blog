<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- 紫罗兰渐变背景 -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- 紫罗兰圆球 -->
  <circle cx="32" cy="32" r="28" fill="url(#bg)"/>

  <!-- 赤道（水平） -->
  <ellipse cx="32" cy="32" rx="28" ry="7" fill="none" stroke="white" stroke-width="2" opacity="0.65"/>

  <!-- 经线（纵向） -->
  <ellipse cx="32" cy="32" rx="7" ry="28" fill="none" stroke="white" stroke-width="2" opacity="0.55"/>

  <!-- "我的位置" 标记（金色圆点） -->
  <circle cx="32" cy="20" r="4" fill="#fbbf24"/>
  <circle cx="32" cy="20" r="2" fill="white"/>
</svg>
