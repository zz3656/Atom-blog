name: Test & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 取消对同一分支/PR 的先前运行，避免浪费 CI 资源
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    needs: lint # type check 必须先通过
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            coverage/
            *.log
          if-no-files-found: ignore
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          DEPLOY_TARGET: github
          REPO_NAME: ${{ github.event.repository.name }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: npm run build

      - name: Verify build output
        run: |
          find dist -name '*.html' | wc -l | xargs echo "HTML pages:"
          test -f dist/rss.xml && echo "RSS: OK"
          test -f dist/sitemap-index.xml && echo "Sitemap: OK"
          test -f dist/_assets/search-index.json && echo "Search index: OK"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 7
